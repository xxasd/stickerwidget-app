server {
    listen 80;
    server_name littlesticker.amile.top;

    root /data/webroot/littlesticker;
    index index.html index.htm;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 32k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # SEO Headers
    add_header X-Robots-Tag "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Sitemap and robots.txt
    location = /robots.txt {
        add_header Content-Type text/plain;
    }
    
    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }
    location ~ .*\.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot) {
        expires 30d;
    }
    location ~ .*\.(js|css)?$ {
        expires 12h;
    }
}
